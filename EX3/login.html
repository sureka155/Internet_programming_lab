<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body style="background-color:#FFF8E7;font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0;">
<h1 style="color: #333; margin-top: 50px; font-size: 36px;">Login Page</h1>
<form action="home.html" style="background-color: white; padding: 30px; border-radius: 12px;  display: inline-block;box-shadow: 2px 2px 15px black; 
margin-top: 20px; width: 300px;">
<label style="font-size: 16px; color: #555; display: block; text-align: left;">Email:</label>
<input type="email" required 
style="width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
<label style="font-size: 16px; color: #555; display: block; text-align: left;">Password:</label>
<input type="password" required 
style="width: 100%; padding: 10px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
<input type="submit" value="Login" 
style="background-color: #ff7e5f; color: white; border: none; padding: 10px; 
width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; 
transition: background 0.3s;"><br><br>
<p style="font-size: 14px; color: #777;">Don't have an account?</p>
<a href="register.html" 
style="color: #ff7e5f; text-decoration: none; font-weight: bold;">Register here</a>
</form>
</body>
</html>
