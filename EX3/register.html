<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body style="text-align:center; background-color:#FFF8E7; font-family:Arial, sans-serif;">

    <h1 style="color:#2C3E50; margin-top:30px;">ONLINE SHOPPING SYSTEM</h1>
    <h2 style="color:#E67E22;">Create Account</h2>

    <form action="login.html" 
          style="display:inline-block; text-align:left; background:#ffffff; padding:25px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1);">

        <label style="font-weight:bold;">First Name:</label><br>
        <input type="text" style="width:250px; padding:8px; margin:5px 0; border:1px solid #ccc; border-radius:5px;"><br><br>

        <label style="font-weight:bold;">Last Name:</label><br>
        <input type="text" style="width:250px; padding:8px; margin:5px 0; border:1px solid #ccc; border-radius:5px;"><br><br>

        <label style="font-weight:bold;">Email:</label><br>
        <input type="email" style="width:250px; padding:8px; margin:5px 0; border:1px solid #ccc; border-radius:5px;"><br><br>

        <label style="font-weight:bold;">Phone:</label><br>
        <input type="tel" style="width:250px; padding:8px; margin:5px 0; border:1px solid #ccc; border-radius:5px;"><br><br>

        <label style="font-weight:bold;">Password:</label><br>
        <input type="password" style="width:250px; padding:8px; margin:5px 0; border:1px solid #ccc; border-radius:5px;"><br><br>

        <label style="font-weight:bold;">Confirm Password:</label><br>
        <input type="password" style="width:250px; padding:8px; margin:5px 0; border:1px solid #ccc; border-radius:5px;"><br><br>

        <input type="submit" value="Create Account" 
               style="width:100%; background-color:#E67E22; color:white; padding:10px; border:none; border-radius:5px; font-size:16px; cursor:pointer;">
    </form>

    <p style="margin-top:20px;">Already have an account?</p>
    <a href="login.html" style="color:lightblue; text-decoration:none; font-weight:bold;">Login Here</a>

</body>
</html>
