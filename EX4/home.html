<!DOCTYPE html>
<html>
<head>
<title>Job Portal - Home Page</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}
body {
background-color: #f2f4f7;
display: flex;
flex-direction: column;
min-height: 100vh;
}
.navbar {
background-color: #2c3e50;
padding: 15px 30px;
display: flex;
justify-content: space-between;
align-items: center;
}
.navbar .brand {
color: white;
font-size: 22px;
font-weight: bold;
}
.navbar .menu a {
color: #bdc3c7;
text-decoration: none;
margin-left: 20px;
font-size: 16px;
padding: 5px 10px;
}
.navbar .menu a:hover, .navbar .menu a.active {
color: white;
background-color: #34495e;
border-radius: 4px;
}
.welcome-box {
max-width: 1000px;
margin: 30px auto;
background-color: white;
padding: 25px;
text-align: center;
border-radius: 8px;
box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
.welcome-box h1 {
color: #2c3e50;
font-size: 28px;
}
.section-container {
max-width: 1000px;
margin: 20px auto;
padding: 0 10px;
}
.section-title {
color: #2c3e50;
margin-bottom: 20px;
font-size: 22px;
}
.job-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 20px;
margin-bottom: 40px;
}
.job-card {
background-color: white;
padding: 25px;
border-radius: 6px;
box-shadow: 0 4px 8px rgba(0,0,0,0.05);
border-top: 4px solid #3498db;
text-align: center;
}
.job-card h3 {
color: #2c3e50;
margin-bottom: 15px;
font-size: 20px;
}
.apply-btn {
display: inline-block;
background-color: #3498db;
color: white;
text-decoration: none;
padding: 10px 20px;
font-size: 14px;
border-radius: 4px;
font-weight: bold;
}
.apply-btn:hover {
background-color: #2980b9;
}
footer {
background-color: #2c3e50;
color: #bdc3c7;
text-align: center;
padding: 15px;
font-size: 14px;
margin-top: auto;
}
</style>
</head>
<body>
<div class="navbar">
<div class="brand">JobPortal</div>
<div class="menu">
<a href="home.html" class="active">Home</a>
<a href="login.html">Login</a>
<a href="register.html">Register</a>
</div>
</div>
<div class="welcome-box">
<h1>Welcome to Online Job Portal</h1>
</div>
<div class="section-container">
<h2 class="section-title">Available Jobs:</h2>
<div class="job-grid">
<div class="job-card">
<h3>Web Developer Job</h3>
<a href="login.html" class="apply-btn">Apply Now</a>
</div>
<div class="job-card">
<h3>Software Engineer Job</h3>
<a href="login.html" class="apply-btn">Apply Now</a>
</div>
<div class="job-card">
<h3>System Analyst Job</h3>
<a href="login.html" class="apply-btn">Apply Now</a>
</div>
</div>
</div>
<footer>
&copy; 2026 Job Portal System. All Rights Reserved.
</footer>
</body>
</html>
